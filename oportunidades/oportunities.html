<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órbita - O hub de oportunidades</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="oportunities_style.css">
</head>
<body>
    <h1>Oportunidades</h1>
    <p>Tá na mão!</p>

    <section id="filtros">

        <input type="text" id="searchInput" placeholder="Buscar...">

        <div id="categories">
            <button class="active pill" data-categoria="">Tudo</button>
            <button class="pill" data-categoria="Olimpíadas Científicas">Olimpíadas Científicas</button>
            <button class="pill" data-categoria="cursos">Cursos</button>
            <button class="pill" data-categoria="formacoes">Formações</button>
            <button class="pill" data-categoria="plataformas">Sites / Plataformas</button>
        </div>

    </section>

    <div id="cards"></div>

    <script src="script.js"></script>
</body>
</html>
