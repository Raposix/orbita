<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órbita - O hub de oportunidades</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="oportunities_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../src/orbitalogofavicon.svg">
</head>
<body>

    <div class="header">
        <h1>Oportunidades</h1>
    </div>

    <section id="filtros">

        <div class="input-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Buscar..." autocomplete="off">
        </div>

        <div id="categories">
            <button class="active pill" data-categoria="">Tudo</button>
            <button class="pill" data-categoria="Olimpíadas Científicas">Olimpíadas Científicas</button>
            <button class="pill" data-categoria="cursos">Cursos</button>
            <button class="pill" data-categoria="formacoes">Formações</button>
            <button class="pill" data-categoria="plataformas">Sites / Plataformas</button>
        </div>

    </section>

    <div id="cards"></div>

    <script src="script.js"></script>

    <script src="../src/navbar.js"></script>
</body>
</html>
